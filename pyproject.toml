[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "davinci-resolve-mcp-free"
version = "0.2.0"
description = "Claude MCP server that runs inside DaVinci Resolve Free — the no-cost edition that doesn't have the Studio Python scripting API. Live Lua bridge + FCPXML export + Lua console snippets + macOS UI automation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "resolve-pilot" }]
dependencies = [
    # 1.x (FastMCP) and 2.x (MCPServer) are both supported, see mcp_server.py.
    "mcp>=1.27.0,<3",
    "pydantic>=2.6",
    "anyio>=4.4",
    "httpx>=0.27",
    "ffmpeg-python>=0.2.0",
    "opentimelineio>=0.17",
]

[project.optional-dependencies]
# Apple Silicon: fastest local Whisper.
transcribe = [
    "mlx-whisper>=0.4.0",
    "numpy>=1.26",
]
# Windows / Linux / Intel Macs (CPU or CUDA).
transcribe-cpu = [
    "faster-whisper>=1.1",
]
ui = [
    "pyobjc-framework-Cocoa>=10.3 ; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.3 ; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.3 ; sys_platform == 'darwin'",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
resolve-pilot = "resolve_pilot.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["resolve_pilot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Correctness rules only; newer ruff releases widened the defaults.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"resolve_pilot/ui_automation/ai_features.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
